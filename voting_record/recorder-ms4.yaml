apiVersion: apps/v1
kind: Deployment
metadata:
  name: recorder-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: recorder
  template:
    metadata:
      labels:
        app: recorder
    spec:
      containers:
        - image: northamerica-northeast2-docker.pkg.dev/sofe4630u-ms1-509300/sofe4630u/recorder:v1
          name: recorder
          volumeMounts:
            - name: voting-credentials
              mountPath: /var/secrets/google
              readOnly: true
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/credentials.json
            - name: Debug
              value: "true"
            - name: POSTGRES_HOST
              value: postgres
            - name: GCP_PROJECT
              value: sofe4630u-ms1-509300
            - name: ELECTION_SUB_ID
              value: election-record-sub
            - name: TOPIC_NAME
              value: election
      volumes:
        - name: voting-credentials
          secret:
            secretName: voting-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - image: northamerica-northeast2-docker.pkg.dev/sofe4630u-ms1-509300/sofe4630u/postgres:election
          name: postgres
          env:
            - name: POSTGRES_DB
              value: election
            - name: POSTGRES_USER
              value: admin
            - name: POSTGRES_PASSWORD
              value: adminpassword
          ports:
            - containerPort: 5432
              name: postgres
---
    